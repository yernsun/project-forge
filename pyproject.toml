[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-forge"
version = "0.3.0"
description = "Composable frontend/backend project generator with controlled template updates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Forge maintainers" }]
dependencies = [
  "copier>=9.12,<10",
  "packaging>=24,<27",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.urls]
Repository = "https://github.com/yernsun/project-forge"

[project.scripts]
project-forge = "project_forge.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_forge"]

[tool.pytest.ini_options]
addopts = "-q --cov=project_forge --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "compat: critical CLI, state migration, and controlled-update compatibility coverage",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/project_forge/template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/project_forge/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["project_forge"]
exclude = ["src/project_forge/template/"]
