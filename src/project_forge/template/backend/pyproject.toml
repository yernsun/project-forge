[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "generated-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.141.1,<1",
  "psycopg[binary,pool]>=3.3.4,<4",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15.0,<3",
  "typer>=0.27.1,<1",
]

[project.optional-dependencies]
auth = [
  "argon2-cffi>=25.1.0,<26",
  "email-validator>=2.3.0,<3",
]
evented = ["redis>=8.1.0,<9"]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=2.3.1,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]
